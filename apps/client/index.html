<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07110f" />
    <script>
      try {
        const savedScheme = localStorage.getItem("mantine-color-scheme-value");
        const scheme = savedScheme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
        document.querySelector('meta[name="theme-color"]').content =
          scheme === "light" ? "#f4f8f5" : "#07110f";
      } catch {
        document.documentElement.setAttribute("data-mantine-color-scheme", "dark");
      }
    </script>
    <meta
      name="description"
      content="Персональный трекер подготовки к frontend-собеседованиям"
    />
    <title>Frontend Sprint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
